interface:
  display_name: "Commit Push"
  short_description: "Commit staged Git changes and push safely."
  default_prompt: "Use $commit-push to commit the staged changes with an allowed type and push the current branch. Prefer git-cz first using its documented non-interactive subject/body flow, and only fall back to plain git commit if git-cz is unavailable."

policy:
  allow_implicit_invocation: true
